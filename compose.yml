services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/app.db"
      PRODUCT_SERVICE_URL: "http://host.docker.internal:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - user_data:/data
    
  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product
    ports:
      - "8001:8001"
volumes:
  user_data: